<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channels - Telegram Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0e1621; color: #e1e3e6; min-height: 100vh; }
  .nav { background: #17212b; padding: 12px 24px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid #2b3945; }
  .nav a { color: #6ab2f2; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 6px; transition: background 0.2s; }
  .nav a:hover, .nav a.active { background: #2b3945; }
  .nav .brand { color: #fff; font-weight: 600; font-size: 16px; margin-right: 16px; }
  .container { max-width: 900px; margin: 24px auto; padding: 0 20px; }
  .card { background: #17212b; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type=text] { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 8px; border: 1px solid #2b3945; background: #0e1621; color: #e1e3e6; font-size: 14px; }
  .toolbar input:focus { outline: none; border-color: #6ab2f2; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
  .btn-primary { background: #2b5278; color: #fff; }
  .btn-primary:hover { background: #3a6ea5; }
  .btn-danger { background: #783030; color: #fff; }
  .btn-danger:hover { background: #a04040; }
  .btn-outline { background: transparent; border: 1px solid #2b3945; color: #e1e3e6; }
  .btn-outline:hover { border-color: #6ab2f2; color: #6ab2f2; }
  .list { max-height: 60vh; overflow-y: auto; }
  .item { display: flex; align-items: center; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background 0.15s; gap: 12px; }
  .item:hover { background: #1b2836; }
  .item.selected { background: #2b3945; }
  .item input[type=checkbox] { width: 18px; height: 18px; accent-color: #6ab2f2; cursor: pointer; }
  .item-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .item-icon.channel { background: #2b5278; }
  .item-icon.group { background: #4a7a2b; }
  .item-icon.legacy_group { background: #7a6b2b; }
  .item-info { flex: 1; min-width: 0; }
  .item-info .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-info .meta { font-size: 12px; color: #8b9bab; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2b3945; color: #8b9bab; }
  #status { padding: 10px; border-radius: 8px; margin-top: 12px; font-size: 13px; display: none; }
  #status.ok { display: block; background: #1b3a1b; color: #6adf6a; }
  #status.err { display: block; background: #3a1b1b; color: #df6a6a; }
  .empty { text-align: center; padding: 40px; color: #8b9bab; }
</style>
</head>
<body>
<nav class="nav">
  <span class="brand">⚡ TG Manager</span>
  <a href="/">Home</a>
  <a href="/channels" class="active">Channels</a>
  <a href="/bots">Bots</a>
</nav>
<div class="container">
  <div class="card">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search channels..." oninput="filter()">
      <button class="btn btn-outline btn-sm" onclick="selectAll()">Select All</button>
      <button class="btn btn-outline btn-sm" onclick="selectNone()">Deselect</button>
      <button class="btn btn-danger" onclick="leaveSelected()">Leave Selected</button>
    </div>
    <div id="list" class="list"><div class="empty">Loading...</div></div>
    <div id="status"></div>
  </div>
</div>
<script>
let channels = [];

async function load() {
  const r = await fetch('/api/channels');
  channels = await r.json();
  render();
}

function render(filterText = '') {
  const el = document.getElementById('list');
  const q = filterText.toLowerCase();
  const filtered = channels.filter(c => c.title.toLowerCase().includes(q));
  if (!filtered.length) { el.innerHTML = '<div class="empty">No channels found</div>'; return; }
  el.innerHTML = filtered.map(c => `
    <div class="item" data-id="${c.id}" onclick="toggle(this, ${c.id})">
      <input type="checkbox" data-id="${c.id}">
      <div class="item-icon ${c.type}">${c.title[0]}</div>
      <div class="item-info">
        <div class="name">${esc(c.title)}</div>
        <div class="meta">${c.type}${c.members ? ' · ' + c.members + ' members' : ''}</div>
      </div>
      <span class="badge">${c.type}</span>
    </div>
  `).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function filter() { render(document.getElementById('search').value); }
function toggle(el, id) {
  const cb = el.querySelector('input[type=checkbox]');
  cb.checked = !cb.checked;
  el.classList.toggle('selected', cb.checked);
}
function selectAll() {
  document.querySelectorAll('.item input[type=checkbox]').forEach(cb => { cb.checked = true; cb.closest('.item').classList.add('selected'); });
}
function selectNone() {
  document.querySelectorAll('.item input[type=checkbox]').forEach(cb => { cb.checked = false; cb.closest('.item').classList.remove('selected'); });
}

async function leaveSelected() {
  const ids = [...document.querySelectorAll('.item input[type=checkbox]:checked')].map(cb => cb.dataset.id);
  if (!ids.length) { show('No channels selected', true); return; }
  if (!confirm(`Leave ${ids.length} channels? This cannot be undone.`)) return;
  const fd = new FormData(); fd.append('ids', ids.join(','));
  const r = await fetch('/api/leave', { method: 'POST', body: fd });
  const res = await r.json();
  const ok = res.filter(x => x.ok).length;
  const fail = res.filter(x => !x.ok).length;
  show(`Left ${ok} channels${fail ? ', failed: ' + fail : ''}`, fail > 0);
  // remove left channels from list
  const leftIds = new Set(res.filter(x => x.ok).map(x => String(x.id)));
  channels = channels.filter(c => !leftIds.has(String(c.id)));
  render(document.getElementById('search').value);
}

function show(msg, err) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = err ? 'err' : 'ok';
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

load();
</script>
</body>
</html>
